name: Keep Render awake

on:
  schedule:
    # Every 10 minutes — under Render free tier's 15-minute idle timeout,
    # with slack for GitHub Actions' own scheduling delay.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BalletMind
        run: curl -sf -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" https://balletmind-app.onrender.com
