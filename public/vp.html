<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vp</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; font: 13px/1.5 -apple-system, sans-serif; color: #222; }
  .probe { position: absolute; left: 0; top: 0; width: 0; visibility: hidden; }
  #p-vh { height: 100vh; } #p-dvh { height: 100dvh; } #p-svh { height: 100svh; } #p-lvh { height: 100lvh; }
  #p-sab { height: env(safe-area-inset-bottom); } #p-sat { height: env(safe-area-inset-top); }
  .col { position: absolute; top: 0; width: 18%; }
  .col i { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; color: #fff; font: 600 11px/36px -apple-system, sans-serif; text-align: center; font-style: normal; }
  #c-vh { left: 0; height: 100vh; } #c-vh i { background: #d33; }
  #c-dvh { left: 20%; height: 100dvh; } #c-dvh i { background: #28a; }
  #c-svh { left: 40%; height: 100svh; } #c-svh i { background: #2a6; }
  #c-lvh { left: 60%; height: 100lvh; } #c-lvh i { background: #a6a; }
  #c-fix { position: fixed; left: 80%; bottom: 0; top: auto; height: 36px; width: 18%; background: #e80; color: #fff; font: 600 11px/36px -apple-system, sans-serif; text-align: center; }
  #out { position: absolute; left: 8px; right: 8px; top: 120px; white-space: pre-wrap; word-break: break-all; font-size: 12px; background: rgba(255,255,255,.92); z-index: 5; }
</style>
</head>
<body>
<div class="probe" id="p-vh"></div><div class="probe" id="p-dvh"></div><div class="probe" id="p-svh"></div><div class="probe" id="p-lvh"></div>
<div class="probe" id="p-sab"></div><div class="probe" id="p-sat"></div>
<div class="col" id="c-vh"><i>100vh</i></div>
<div class="col" id="c-dvh"><i>100dvh</i></div>
<div class="col" id="c-svh"><i>100svh</i></div>
<div class="col" id="c-lvh"><i>100lvh</i></div>
<div id="c-fix">fixed</div>
<div id="out">measuring…</div>
<script>
function px(id) { return Math.round(document.getElementById(id).getBoundingClientRect().height); }
function show() {
  var vv = window.visualViewport;
  var lines = [
    '把这一屏截图发给我',
    '',
    'innerHeight: ' + window.innerHeight,
    'visualViewport.height: ' + (vv ? Math.round(vv.height) : 'n/a') + '  offsetTop: ' + (vv ? Math.round(vv.offsetTop) : 'n/a'),
    'documentElement.clientHeight: ' + document.documentElement.clientHeight,
    'screen.height: ' + screen.height,
    '100vh: ' + px('p-vh') + '  100dvh: ' + px('p-dvh'),
    '100svh: ' + px('p-svh') + '  100lvh: ' + px('p-lvh'),
    'safe-area bottom: ' + px('p-sab') + '  top: ' + px('p-sat'),
    'standalone: ' + (window.navigator.standalone === true),
    'UA: ' + navigator.userAgent
  ];
  document.getElementById('out').textContent = lines.join('\n');
}
show();
window.addEventListener('resize', show);
if (window.visualViewport) window.visualViewport.addEventListener('resize', show);
</script>
</body>
</html>
